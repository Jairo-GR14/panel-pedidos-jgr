<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 text-stone-800">
    <!-- Barra de navegacion -->
    <header class="bg-white border-b border-stone-200">
        <nav class="mx-auto flex max-w-5xl items-center justify-between p-4">
            <span class="text-lg font-semibold">JGR</span>
            <ul class="hidden gap-6 text-sm sm:flex">
                <li><a href="#" class="hover:text-green-400">Pedidos</a></li>
                <li><a href="#" class="hover:text-green-600">Clientes</a></li>
                <li><a href="#" class="hover:text-green-600">Catalogo</a></li>
            </ul>
            <button class="rounded-lg bg-stone-800 px-4 py-2 text-sm text-white hover:bg-stone-700">
                Nuevo Pedido
            </button>
        </nav>
    </head>

    <main class="mx-auto max-w-5xl space-y-8 p-4 py-8">
        <h1 class="text-3xl font-semibold">Pedidos de la Semana</h1>

        <!-- Indicadores: 1 columna para movil, 3 para pantallas grandes -->
        <section class="grid gap-4 sm:grid-cols-3">
            <article class="rounded-xl border border-stone-200 bg-white p-5">
                <p class="text-sm text-stone-500">En Produccion</p>
                <p class="mt-1 text-3xl font-semibold text-cyan-600">18</p>
            </article>

            <article class="rounded-xl border border-stone-200 bg-white p-5">
                <p class="text-sm text-stone-500">Por entregar</p>
                <p class="mt-1 text-3xl font-semibold text-cyan-600">5</p>
            </article>

            <article class="rounded-xl border border-stone-200 bg-white p-5">
                <p class="text-sm text-stone-500">Entregados</p>
                <p class="mt-1 text-3xl font-semibold text-cyan-600">15</p>
            </article>
        </section>

        <!-- TABLA -->
         <section class="overflow-x-auto rounded-b-xl border border-stone-300 bg-white">
            <table class="w-full text-left text-sm">
                <thead class="border-b  border-stone-200 text-stone-500">
                    <tr>
                        <th class="p-4 font-medium">Folio</th>
                        <th class="p-4 font-medium">Cliente</th>
                        <th class="p-4 font-medium">
                            Etapa
                        </th>
                        <th class="p-4 font-medium">Entrega</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-stone-100">
                    <tr class="hover:bg-stone-50">
                        <td class="p-4 font-medium">1045</td>
                        <td class="p-4">Casa Talavera</td>
                        <td class="p-4">
                            <span class="rounded-full bg-emerald-100 px-3 py-1 text-green-700">Esmaltado</span></td>
                        <td class="p-4">14 oct</td>
                    </tr>
                    <tr class="hover:bg-stone-50">
                        <td class="p-4 font-medium">1043</td>
                        <td class="p-4">Hotel Posada</td>
                        <td class="p-4">
                            <span class="rounded-full bg-emerald-100 px-3 py-1 text-green-700">Empaque</span></td>
                        <td class="p-4">12 oct</td>
                    </tr>
                    <tr class="hover:bg-stone-50">
                        <td class="p-4 font-medium">1044</td>
                        <td class="p-4">Manzanita Store</td>
                        <td class="p-4">
                            <span class="rounded-full bg-emerald-100 px-3 py-1 text-green-700">Entregas</span></td>
                        <td class="p-4">12 oct</td>
                    </tr>
                    <tr class="hover:bg-stone-50">
                        <td class="p-4 font-medium">1046</td>
                        <td class="p-4">Hotel Arca</td>
                        <td class="p-4">
                            <span class="rounded-full bg-emerald-100 px-3 py-1 text-green-700">Empaque</span></td>
                        <td class="p-4">12 oct</td>
                    </tr>
                </tbody>
            </table>
         </section>

         <!-- Formulario -->
          <section class="rounded-xl border border-t-stone-300 bg-white p-6">
            <h2 class="text-xl font-semibold">Registrar Pedido</h2>
            <form class="mt-4 grid gap-4 sm:grid-cols-2">
                <div>
                    <label for="cliente" class="block text-sm text-stone-600">Cliente</label>
                    <input id="cliente" type="text" class="mt-1 w-full rounded-lg border border-stone-300 p-2 hover:border-green-500 focus:outline-none">
                </div>
                <div>
                    <label for="piezas" class="block text-sm text-stone-600">Piezas</label>
                    <input id="piezas" type="number" min="1" value="1" class="mt-1 w-full rounded-lg border border-stone-300 p-2 hover:border-green-500 focus:outline-none">
                </div>
                <div class="sm:col-span-2 sm:text-right text-center ">
                    <button class="rounded-lg bg-green-600 px-5 py-2 text-white hover:bg-green-700">
                        Guardar
                    </button>
                </div>
            </form>
          </section>
    </main>
</body>
</html>
